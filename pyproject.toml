[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "qrflight"
version = "0.1.0"
description = "Offline QR print-readiness preflight and deterministic robustness testing"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "KanadeK", email = "121669563+KanadeK@users.noreply.github.com" },
]
keywords = ["qr-code", "preflight", "print", "quality", "cli", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Printing",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.11,<5",
  "pillow>=11,<13",
  "rich>=14,<15",
  "typer>=0.16,<1",
  "zxing-cpp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "hatchling==1.27.0",
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
  "twine==6.1.0",
]

[project.urls]
Homepage = "https://github.com/KanadeK/qrflight"
Documentation = "https://github.com/KanadeK/qrflight#readme"
Issues = "https://github.com/KanadeK/qrflight/issues"
Source = "https://github.com/KanadeK/qrflight"

[project.scripts]
qrflight = "qrflight.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qrflight"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/scripts",
  "/README.md",
  "/README.zh-CN.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["qrflight"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qrflight"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["cv2", "zxingcpp"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "C4", "PTH", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["S603"]
"tests/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

