name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --extra dev --python 3.13
      - run: uv run --python 3.13 python scripts/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: qrflight-package
          path: dist/

  windows-python-312:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run --python 3.12 pytest -q
